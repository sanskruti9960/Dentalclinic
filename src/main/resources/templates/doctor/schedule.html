<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/navbar :: head('Dr. Smita Bevle - Master Operatory Schedule')}"></head>
<body class="bg-[#f8fafc] text-slate-900 min-h-screen flex flex-col font-sans">
    
    <header th:replace="~{layout/navbar :: navbar}"></header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 space-y-6">
        
        <!-- Header Section -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-white p-6 rounded-3xl border border-slate-200 shadow-2xs">
            <div>
                <div class="inline-flex items-center gap-1.5 text-xs font-bold text-indigo-700 bg-indigo-50 px-3 py-1 rounded-full mb-1">
                    Operatory Real-Time Management
                </div>
                <h1 class="text-2xl font-black text-slate-900">Today's Operatory Schedule</h1>
                <p class="text-xs text-slate-500 mt-0.5" th:text="'Date: ' + ${currentDate} + ' | Doctor: ' + ${doctorName}">Date: 2026-09-25 | Doctor: Dr. Smita Bevle</p>
            </div>

            <div class="flex items-center gap-2">
                <span class="px-3 py-1.5 rounded-2xl bg-indigo-100 text-indigo-900 text-xs font-bold">
                    <span th:text="${appointments.size()}">2</span> Booked Appointments
                </span>
            </div>
        </div>

        <!-- Appointments List -->
        <div class="bg-white rounded-3xl border border-slate-200 p-6 shadow-2xs space-y-4">
            <h2 class="text-sm font-bold text-slate-900 uppercase tracking-wider">Scheduled Operatory Procedures</h2>

            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs">
                    <thead>
                        <tr class="border-b border-slate-200 text-slate-500 font-bold">
                            <th class="py-3 px-4">Time</th>
                            <th class="py-3 px-4">Chair</th>
                            <th class="py-3 px-4">Patient Name</th>
                            <th class="py-3 px-4">Procedure</th>
                            <th class="py-3 px-4">Status</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100 font-medium">
                        <tr th:each="apt : ${appointments}" class="hover:bg-slate-50/70 transition">
                            <td class="py-3.5 px-4 font-mono font-bold text-slate-900" th:text="${apt.time}">10:30 AM</td>
                            <td class="py-3.5 px-4">
                                <span class="px-2 py-0.5 rounded-full text-[10px] font-extrabold bg-purple-100 text-purple-800" th:text="'Chair ' + ${apt.chair}">Chair 1</span>
                            </td>
                            <td class="py-3.5 px-4 font-bold text-slate-900" th:text="${apt.patientName}">Sanskruti Bhosale</td>
                            <td class="py-3.5 px-4 text-slate-700" th:text="${apt.procedure}">Composite Restoration</td>
                            <td class="py-3.5 px-4">
                                <span class="px-2.5 py-1 rounded-full text-[10px] font-bold"
                                      th:classappend="${apt.status.name() == 'IN_CHAIR'} ? 'bg-amber-100 text-amber-900' : 'bg-blue-100 text-blue-900'"
                                      th:text="${apt.status}">IN_CHAIR</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

</body>
</html>
