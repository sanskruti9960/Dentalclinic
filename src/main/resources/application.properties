# ===================================================================
# Smita Dental Clinic & Implant Centre - Application Configuration
# Enterprise Spring Boot Application Properties
# ===================================================================

server.port=8080
spring.application.name=SmitaDentalClinicBackend

# Database Configuration (H2 In-Memory for instant running & evaluation)
spring.datasource.url=jdbc:h2:mem:dentalclinicdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# JPA & Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Web Console (Available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Swagger / OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# CORS Settings for Frontend Integration
clinic.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000
