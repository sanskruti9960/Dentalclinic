# ===================================================================
# Smita Dental Clinic & Implant Centre - Application Configuration
# Enterprise Spring Boot Application Properties (PostgreSQL Database)
# ===================================================================

server.port=8080
spring.application.name=SmitaDentalClinicBackend

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:dentalclinicdb}?sslmode=prefer
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}

# JPA & Hibernate Settings (PostgreSQL Dialect)
spring.jpa.database=POSTGRESQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Database Schema & Data Initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# Swagger / OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# CORS Settings for Frontend Integration
clinic.cors.allowed-origins=${FRONTEND_ORIGIN:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000}

# ===================================================================
# Razorpay Payment Gateway Configuration (Test Mode by default)
# ===================================================================
razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_placeholderKeyId}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:placeholderKeySecret}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:placeholderWebhookSecret}
razorpay.currency=INR
razorpay.company-name=Smita Dental Clinic & Implant Centre

# Application Environment (test / production)
app.env=${APP_ENV:test}
app.base-url=${APP_URL:http://localhost:8080}
