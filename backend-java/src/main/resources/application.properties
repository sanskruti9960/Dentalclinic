# ===================================================================
# Smita Dental Clinic - Spring Boot Application Configuration
# Sole Practitioner: Dr. Smita Bevle (BDS, MDS)
# ===================================================================

server.port=8080
spring.application.name=smita-dental-clinic-backend

# H2 Database configuration for fast local prototyping (or switch to PostgreSQL)
spring.datasource.url=jdbc:h2:mem:smitaclinicdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Secret Key (Base64 encoded) and Expiration (24 hours)
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000

# CORS settings
cors.allowed-origins=http://localhost:3000,http://localhost:5173
